on:
  push:
    branches:
      - master
    tags-ignore:
      - '*'
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: "actions/checkout@v4"
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install build-essential libgtk-3-dev libasound2-dev
      - name: Build tools
        run: |
          cd linux
          make
      - name: Upload linux
        uses: actions/upload-artifact@v4
        with:
          name: Tuner
          path: linux/tuner
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: "actions/checkout@v4"
      - name: Build tools
        run: |
          cd swift
          make dmg
      - name: Upload Tuner
        uses: actions/upload-artifact@v4
        with:
          name: Tuner.app
          path: swift/Tuner.app
      - name: Upload Dmg
        uses: actions/upload-artifact@v4
        with:
          name: Tuner.dmg
          path: swift/Tuner-*.dmg
          if-no-files-found: error
